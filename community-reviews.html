<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>community reviews</title>
</head>
<body style="background-color: #f7dde3; font-family: 'Georgia', serif; text-align: center; padding-top: 80px;">
  <h1 style="color: #5c4a4a; font-weight: normal; letter-spacing: 4px; font-size: 28px;">COMMUNITY REVIEWS</h1>
  <p style="color: #8a7373; font-style: italic; font-size: 14px;">what our readers are saying</p>
  <hr style="width: 15%; border: none; border-top: 1px solid #d8b8c0; margin: 30px auto;">
  <div style="max-width: 600px; margin: 40px auto; text-align: left; padding: 0 40px;">
    <p style="color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">YOUR NAME</p>
    <input id="name" type="text" placeholder="enter your name" maxlength="100" style="width: 100%; padding: 12px; font-family: 'Georgia', serif; font-size: 14px; border: 1px solid #d8b8c0; background-color: #fdf0f3; color: #5c4a4a; box-sizing: border-box; margin-bottom: 24px;">
    <p style="color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">BOOK NAME</p>
    <input id="book" type="text" placeholder="enter book title" maxlength="200" style="width: 100%; padding: 12px; font-family: 'Georgia', serif; font-size: 14px; border: 1px solid #d8b8c0; background-color: #fdf0f3; color: #5c4a4a; box-sizing: border-box; margin-bottom: 24px;">
    <p style="color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">YOUR RATING</p>
    <select id="rating" style="width: 100%; padding: 12px; font-family: 'Georgia', serif; font-size: 14px; border: 1px solid #d8b8c0; background-color: #fdf0f3; color: #5c4a4a; box-sizing: border-box; margin-bottom: 24px;">
      <option value="">select a rating</option>
      <option>10 / 10</option><option>9 / 10</option><option>8 / 10</option><option>7 / 10</option><option>6 / 10</option><option>5 / 10</option><option>4 / 10</option><option>3 / 10</option><option>2 / 10</option><option>1 / 10</option>
    </select>
    <p style="color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">YOUR REVIEW</p>
    <textarea id="review" maxlength="5000" placeholder="write your review here..." style="width: 100%; padding: 12px; font-family: 'Georgia', serif; font-size: 14px; border: 1px solid #d8b8c0; background-color: #fdf0f3; color: #5c4a4a; box-sizing: border-box; height: 150px; margin-bottom: 24px; resize: vertical;"></textarea>
    <p style="color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">PERSONAL THOUGHTS</p>
    <textarea id="thoughts" maxlength="5000" placeholder="anything else you'd like to share..." style="width: 100%; padding: 12px; font-family: 'Georgia', serif; font-size: 14px; border: 1px solid #d8b8c0; background-color: #fdf0f3; color: #5c4a4a; box-sizing: border-box; height: 150px; margin-bottom: 24px; resize: vertical;"></textarea>
    <p style="color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px;">WOULD YOU RECOMMEND THIS BOOK?</p>
    <select id="recommend" style="width: 100%; padding: 12px; font-family: 'Georgia', serif; font-size: 14px; border: 1px solid #d8b8c0; background-color: #fdf0f3; color: #5c4a4a; box-sizing: border-box; margin-bottom: 40px;">
      <option value="">select an option</option><option>absolutely!</option><option>yes, with reservations</option><option>not really</option><option>definitely not</option>
    </select>
    <div style="text-align: center;"><button id="submit-review" onclick="submitReview()" style="width: 200px; height: 50px; background-color: transparent; color: #5c4a4a; border: 1px solid #5c4a4a; font-size: 12px; letter-spacing: 2px; font-family: 'Georgia', serif; cursor: pointer;">SUBMIT REVIEW</button></div>
  </div>
  <hr style="width: 15%; border: none; border-top: 1px solid #d8b8c0; margin: 60px auto 20px;">
  <h2 style="color: #5c4a4a; font-weight: normal; letter-spacing: 4px; font-size: 22px; margin-top: 40px;">READER REVIEWS</h2>
  <p style="color: #8a7373; font-style: italic; font-size: 14px;">from our little community of readers</p>
  <div id="reviews-container" style="max-width: 600px; margin: 40px auto; padding: 0 40px;"><p id="no-reviews" style="color: #8a7373; font-style: italic; font-size: 14px;">loading reviews...</p></div>
  <hr style="width: 15%; border: none; border-top: 1px solid #d8b8c0; margin: 60px auto 20px;">
  <a href="the reading nook.html" style="text-decoration: none; color: #8a7373; font-size: 12px; letter-spacing: 2px;">← BACK TO HOME</a>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Fill in these three values before publishing. Never use a secret/service-role key here.
    const SUPABASE_URL = 'https://lbhtbaoymzlkdmgswakp.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'sb_publishable_a9PLtkpvTf1cSX1X68BLQQ_LGMByTvn';
    const TABLE_NAME = 'reviews';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const fieldIds = ['name', 'book', 'rating', 'review', 'thoughts', 'recommend'];
    async function submitReview() {
      const values = Object.fromEntries(fieldIds.map(id => [id, document.getElementById(id).value.trim()]));
      if (fieldIds.some(id => !values[id])) { alert('please fill in all fields before submitting!'); return; }
      const button = document.getElementById('submit-review');
      button.disabled = true;
      button.textContent = 'SUBMITTING...';
      try {
        const { error } = await db.from(TABLE_NAME).insert([{
          reviewer_name: values.name, book: values.book, rating: values.rating,
          review: values.review, thoughts: values.thoughts, recommend: values.recommend
        }]);
        if (error) throw error;
        fieldIds.forEach(id => document.getElementById(id).value = '');
        alert('your review has been submitted successfully! ♡');
        await loadReviews();
      } catch (error) {
        console.error('Submission error:', error);
        alert('something went wrong. please try again!');
      } finally {
        button.disabled = false;
        button.textContent = 'SUBMIT REVIEW';
      }
    }
    function displayReview(item) {
      const card = document.createElement('div');
      card.style.cssText = 'background-color: #fdf0f3; border: 1px solid #d8b8c0; padding: 30px; margin-bottom: 30px; text-align: left;';
      function addText(value, style) {
        const p = document.createElement('p');
        p.style.cssText = style;
        p.textContent = value ?? '';
        card.appendChild(p);
      }
      addText((item.book || '').toUpperCase(), 'color: #5c4a4a; font-size: 13px; letter-spacing: 2px; margin: 0 0 4px 0; overflow-wrap: anywhere;');
      addText(`reviewed by ${item.reviewer_name || ''} · ${item.rating || ''} · ${item.recommend || ''}`, 'color: #8a7373; font-style: italic; font-size: 12px; margin: 0 0 16px 0; overflow-wrap: anywhere;');
      const hr = document.createElement('hr');
      hr.style.cssText = 'border: none; border-top: 1px solid #d8b8c0; margin-bottom: 16px;';
      card.appendChild(hr);
      addText('REVIEW', 'color: #5c4a4a; font-size: 13px; letter-spacing: 1px; margin-bottom: 6px;');
      addText(item.review, 'color: #5c4a4a; font-size: 14px; line-height: 1.8; margin-bottom: 20px; white-space: pre-wrap; overflow-wrap: anywhere;');
      addText('PERSONAL THOUGHTS', 'color: #5c4a4a; font-size: 13px; letter-spacing: 1px; margin-bottom: 6px;');
      addText(item.thoughts, 'color: #5c4a4a; font-size: 14px; line-height: 1.8; white-space: pre-wrap; overflow-wrap: anywhere;');
      document.getElementById('reviews-container').appendChild(card);
    }
    async function loadReviews() {
      const container = document.getElementById('reviews-container');
      const { data, error } = await db.from(TABLE_NAME).select('*').order('id', { ascending: false });
      if (error) {
        console.error('Loading error:', error);
        container.textContent = 'could not load reviews. please try refreshing!';
        return;
      }
      container.replaceChildren();
      if (!data || data.length === 0) {
        const p = document.createElement('p');
        p.id = 'no-reviews';
        p.style.cssText = 'color: #8a7373; font-style: italic; font-size: 14px;';
        p.textContent = 'no reviews yet — be the first to share your thoughts!';
        container.appendChild(p);
        return;
      }
      data.forEach(displayReview);
    }
    loadReviews();
  </script>
</body>
</html>
