<!DOCTYPE html>
<html>
<head>
  <title>fantasy / dystopian standalone</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet">
</head>
<body style="background-color: #d4edda; font-family: 'Cormorant Garamond', serif; text-align: center; padding-top: 80px;">
  <h1 style="color: #4a5c4a; font-weight: 300; letter-spacing: 8px; font-size: 36px;">FANTASY / DYSTOPIAN</h1>
  <p style="color: #6b8c6b; font-style: italic; font-size: 16px; letter-spacing: 2px;">standalone</p>
  <hr style="width: 15%; border: none; border-top: 1px solid #a8c8a8; margin: 30px auto;">
  <div style="display: flex; justify-content: center; flex-wrap: wrap; gap: 30px; margin-top: 50px; padding: 0 40px;">
    <a href="shatterme.html" style="text-decoration: none;">
      <div style="width: 160px; background-color: #ffb7ce; border: 1px solid #f99ab5; cursor: pointer; padding: 15px; transition: all 0.3s ease;">
        <img src="shatterme.jpg" style="width: 100%; height: 200px; object-fit: cover;">
        <p style="color: #5c4a4a; font-family: 'Tenor Sans', sans-serif; font-size: 11px; letter-spacing: 1px; margin-top: 12px;">SHATTER ME</p>
      </div>
    </a>
  </div>
  <hr style="width: 15%; border: none; border-top: 1px solid #a8c8a8; margin: 60px auto 20px;">
  <a href="standalone.html" style="text-decoration: none; color: #6b8c6b; font-family: 'Tenor Sans', sans-serif; font-size: 11px; letter-spacing: 2px;">← BACK</a>
  <audio id="bgm" loop><source src="bgm.mp3" type="audio/mpeg"></audio>
  <div style="position: fixed; bottom: 20px; right: 20px; background-color: #f0faf0; border: 1px solid #a8c8a8; padding: 10px 20px; font-family: 'Tenor Sans', sans-serif; font-size: 11px; letter-spacing: 2px; color: #4a5c4a; cursor: pointer;" onclick="toggleMusic()">
    <span id="music-label">♪ PLAY MUSIC</span>
  </div>
  <script>
    const audio = document.getElementById('bgm'); let playing = false;
    function toggleMusic() { if (playing) { audio.pause(); document.getElementById('music-label').textContent = '♪ PLAY MUSIC'; playing = false; } else { audio.play(); document.getElementById('music-label').textContent = '♫ PAUSE MUSIC'; playing = true; } }
  </script>
</body>
</html>
